services:
  launcher:
    build:
      context: .
      dockerfile: launcher/Dockerfile
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      TEMPLATE_DOMAIN: ${TEMPLATE_DOMAIN}
      DEMOPRESS_THEME: ${DEMOPRESS_THEME:-default}
      DEMOPRESS_PROFILE: ${DEMOPRESS_PROFILE:-default}
      DEFAULT_DEMO_LIFETIME: ${DEFAULT_DEMO_LIFETIME:-7200}
      MAX_DEMO_LIFETIME: ${MAX_DEMO_LIFETIME:-43200}
      FAILED_RETENTION: ${FAILED_RETENTION:-1800}
      MAX_ACTIVE_DEMOS: ${MAX_ACTIVE_DEMOS:-10}
      MAX_ACTIVE_DEMOS_PER_IP: ${MAX_ACTIVE_DEMOS_PER_IP:-2}
      MAX_LAUNCHES_PER_IP_PER_HOUR: ${MAX_LAUNCHES_PER_IP_PER_HOUR:-5}
      MIN_FREE_MEMORY_MB: ${MIN_FREE_MEMORY_MB:-1024}
      SQLITE_PATH: ${SQLITE_PATH:-/data/database.sqlite}
      DOCKER_SOCKET: ${DOCKER_SOCKET:-/var/run/docker.sock}
      DOCKER_NETWORK: ${DOCKER_NETWORK:-coolify}
      TRAEFIK_ENTRYPOINTS: ${TRAEFIK_ENTRYPOINTS:-http,https}
      TRAEFIK_CERTRESOLVER: ${TRAEFIK_CERTRESOLVER:-letsencrypt}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      INTERNAL_TEMPLATE_TOKEN: ${INTERNAL_TEMPLATE_TOKEN}
      DEMO_IMAGE: ${DEMO_IMAGE:-demopress-wordpress:1.0}
      SNAPSHOT_ROOT: ${SNAPSHOT_ROOT:-/data/snapshots}
      MAX_SNAPSHOTS: ${MAX_SNAPSHOTS:-5}
      AUTO_BUILD_DEMO_IMAGE: ${AUTO_BUILD_DEMO_IMAGE:-1}
      TZ: ${TZ:-Europe/London}

      DEMO_CAPTURE_EMAIL: ${DEMO_CAPTURE_EMAIL:-0}
      DEMO_REQUIRE_EMAIL: ${DEMO_REQUIRE_EMAIL:-0}
      DEMO_CAPTURE_NAME: ${DEMO_CAPTURE_NAME:-0}
      DEMO_REQUIRE_NAME: ${DEMO_REQUIRE_NAME:-0}
      DEMO_CAPTURE_COMPANY: ${DEMO_CAPTURE_COMPANY:-0}
      DEMO_REQUIRE_COMPANY: ${DEMO_REQUIRE_COMPANY:-0}
      DEMO_CAPTURE_NOTICE: ${DEMO_CAPTURE_NOTICE:-Your details are used to provide and manage this temporary demo.}

      RESEND_SEND_DEMO_INFO: ${RESEND_SEND_DEMO_INFO:-0}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      RESEND_FROM_NAME: ${RESEND_FROM_NAME:-DemoPress}
      RESEND_REPLY_TO: ${RESEND_REPLY_TO:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - demopress_data:/data
    networks:
      - public

  template:
    image: demopress-wordpress:1.0
    build:
      context: ./demo
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: template-db:3306
      WORDPRESS_DB_USER: demopress
      WORDPRESS_DB_PASSWORD: ${TEMPLATE_DB_PASSWORD:-demopress-template-db}
      WORDPRESS_DB_NAME: demopress
      DEMOPRESS_MODE: template
      DEMOPRESS_TEMPLATE_DOMAIN: ${TEMPLATE_DOMAIN}
      WORDPRESS_CONFIG_EXTRA: |
        define('DEMOPRESS_MODE', 'template');
        define('DEMOPRESS_TEMPLATE_DOMAIN', '${TEMPLATE_DOMAIN}');
        define('WP_HOME', 'https://${TEMPLATE_DOMAIN}');
        define('WP_SITEURL', 'https://${TEMPLATE_DOMAIN}');
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && strpos($$_SERVER['HTTP_X_FORWARDED_PROTO'], 'https') !== false) {
          $$_SERVER['HTTPS'] = 'on';
        }
      INTERNAL_TEMPLATE_TOKEN: ${INTERNAL_TEMPLATE_TOKEN}
    volumes:
      - demopress_template_wp:/var/www/html
    depends_on:
      - template-db
    networks:
      - public
      - template_internal

  template-db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: demopress
      MARIADB_USER: demopress
      MARIADB_PASSWORD: ${TEMPLATE_DB_PASSWORD:-demopress-template-db}
      MARIADB_ROOT_PASSWORD: ${TEMPLATE_DB_ROOT_PASSWORD:-demopress-template-root}
    volumes:
      - demopress_template_db:/var/lib/mysql
    networks:
      - template_internal

volumes:
  demopress_data:
  demopress_template_wp:
  demopress_template_db:

networks:
  public:
    name: ${DOCKER_NETWORK:-coolify}
    external: true
  template_internal:
    driver: bridge
    internal: true
