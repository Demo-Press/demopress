name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag matches application version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${VERSION}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match package version v${VERSION}." >&2
            exit 1
          }

      - name: Create or verify GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving its curated notes unchanged."
            exit 0
          fi

          if gh release create "$GITHUB_REF_NAME" \
            --title "DemoPress ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag; then
            exit 0
          fi

          # Publishing a pre-created draft can race this tag-triggered workflow.
          # Treat the release as successful if it became visible meanwhile.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1
