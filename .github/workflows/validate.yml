name: Validate DemoPress

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check launcher JavaScript
        run: find launcher/src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check shell scripts
        run: find . -type f -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -n1 sh -n
      - name: Guard external theme selection
        run: |
          grep -F 'source_dir="$staging/themes/$THEME_NAME"' launcher/entrypoint.sh
          grep -F '[ -f "$staging/theme.json" ]' launcher/entrypoint.sh
          grep -F 'Demo-Press/demopress-themes/tarball/{ref}' env/wpraffle.env.example
          test ! -e themes/wpraffle/theme.json
          test ! -e themes/wpraffle/theme.css
      - name: Check DemoPress Agent PHP
        run: find demo/wp-content -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Check JSON files
        run: |
          node - <<'NODE'
          const fs=require('fs'),path=require('path');
          function walk(p){for(const e of fs.readdirSync(p,{withFileTypes:true})){const f=path.join(p,e.name);if(e.isDirectory()&&!f.includes('/.git'))walk(f);else if(e.isFile()&&f.endsWith('.json'))JSON.parse(fs.readFileSync(f,'utf8'));}}
          walk('.');
          NODE
      - name: Guard canonical DemoPress Agent REST route
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('launcher/src/snapshots.js','utf8');
          if(!s.includes('/wp-json/demopress-agent/v1/${encodeURIComponent(ep)}/')) throw new Error('Agent pretty REST URL must end with a trailing slash');
          if(!s.includes('redirect:"manual"')) throw new Error('Authenticated template requests must not follow redirects');
          NODE
      - name: Guard V1 release hardening
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const cfg=fs.readFileSync('launcher/src/config.js','utf8');
          const db=fs.readFileSync('launcher/src/database.js','utf8');
          const life=fs.readFileSync('launcher/src/lifecycle.js','utf8');
          const server=fs.readFileSync('launcher/src/server.js','utf8');
          if(!cfg.includes('platformVersion:"1.0.0"')||!cfg.includes('buildVersion:"1.0.0"')) throw new Error('V1 version markers are not aligned');
          if(!db.includes('demopress_public_launch_guard')||!db.includes('demopress_public_launch_log')) throw new Error('Database launch guard is missing');
          if(!life.includes('stale_provisioning_timeout')||!life.includes("delete_reason,'')!='expired'")) throw new Error('Lifecycle recovery/expiry guard is missing');
          for(const h of ['X-Content-Type-Options','X-Frame-Options','Referrer-Policy','Permissions-Policy','Strict-Transport-Security']) if(!server.includes(h)) throw new Error('Missing security header: '+h);
          NODE
