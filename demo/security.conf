ServerName localhost

# Block dotfiles, environment/configuration material, database/key artifacts
# and WordPress configuration files from direct HTTP access. Files remain
# available to PHP/WordPress internally; this only affects web requests.
<FilesMatch "(^\.|\.env|\.git|\.svn|\.hg|composer\.(json|lock)|package(-lock)?\.json|yarn\.lock|wp-config.*|debug\.log|.*\.(sql|pem|key))$">
    Require all denied
</FilesMatch>

# Remove low-value public fingerprinting/default files from disposable demos.
RedirectMatch 404 (?i)^/(phpinfo\.php|php_info\.php|info\.php|adminer\.php|readme\.html|license\.txt|wp-config-sample\.php)$

# Directory listings are never useful in a disposable product demo.
<Directory /var/www/html>
    Options -Indexes
</Directory>
